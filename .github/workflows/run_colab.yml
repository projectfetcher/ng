name: Run Nigeria MimusJobs

on:
  schedule:
    - cron: "29 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:

permissions:
  contents: write   # needed to commit the tracker CSV back to the repo

# Never let two runs overlap (they'd fight over the same tracker file)
concurrency:
  group: mimusjobs-nigeria-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      INTERNAL_BOT_KEY: ${{ secrets.INTERNAL_BOT_KEY }}
      # Sets the tracker filename: Nigeria → processed_jobs_nigeria.csv
      COUNTRY_NAME: Nigeria

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download NLTK data
        run: |
          python -c "import nltk; nltk.download('punkt_tab', quiet=True); nltk.download('averaged_perceptron_tagger', quiet=True)"

      - name: Run job script
        run: python run_colab.py

      # Safety net: the script already pushes the CSV after every posted job
      - name: Commit updated tracker CSV
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add processed_jobs_*.csv
          git diff --cached --quiet || git commit -m "Update tracker CSV [skip ci]"
          git pull --rebase --autostash || true
          git push || true

      - name: Upload tracker CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: processed-jobs-tracker
          path: processed_jobs_*.csv
          retention-days: 30
